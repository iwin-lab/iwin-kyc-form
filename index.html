<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iWIN Wealth Planning — Client Intake Form</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6f9;min-height:100vh;padding:2rem 1rem}
:root{--iwin-blue:#1B6FC8;--iwin-dark:#0E4A8A;--iwin-light:#E6F1FB;--iwin-mid:#B5D4F4}
.container{max-width:700px;margin:0 auto}
.form-header{background:var(--iwin-dark);border-radius:12px 12px 0 0;padding:1.25rem 1.5rem;display:flex;align-items:center;gap:14px}
.logo-circle{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.logo-circle img{width:48px;height:48px;object-fit:contain}
.header-text{color:#fff}
.header-title{font-size:17px;font-weight:600}
.header-sub{font-size:12px;opacity:0.75;margin-top:2px}
.form-body{background:#f4f6f9;padding:1.25rem;border-radius:0 0 12px 12px;border:1px solid #dce3ed;border-top:none}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:0.75rem}
.dot{width:8px;height:8px;border-radius:50%;background:#B5D4F4;transition:all 0.2s}
.dot.active{background:var(--iwin-blue);width:20px;border-radius:4px}
.dot.done{background:#28a745}
.progress-bar-outer{background:#B5D4F4;border-radius:4px;height:4px;margin-bottom:0.4rem}
.progress-bar-inner{background:var(--iwin-blue);border-radius:4px;height:4px;transition:width 0.3s}
.step-label{font-size:12px;color:#666;margin-bottom:1.25rem}
.step-header{font-size:17px;font-weight:600;color:#1a1a2e;margin-bottom:0.2rem}
.step-sub{font-size:13px;color:#555;margin-bottom:1.25rem;line-height:1.6}
.section{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.25rem;margin-bottom:0.75rem}
.section-title{font-size:11px;font-weight:600;color:var(--iwin-blue);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.field-row.one{grid-template-columns:1fr}
.field-row.three{grid-template-columns:1fr 1fr 1fr}
.field-group{display:flex;flex-direction:column;gap:3px}
label.fl{font-size:12px;color:#444;font-weight:500}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #d0d7de;border-radius:6px;font-size:13px;background:#fff;color:#1a1a2e;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--iwin-blue);box-shadow:0 0 0 2px rgba(27,111,200,0.15)}
textarea{resize:vertical;min-height:60px}
.tip{font-size:11px;color:#888;margin-top:3px;line-height:1.5}
.radio-group{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.radio-btn{padding:5px 12px;border:1px solid #d0d7de;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#333;transition:all 0.15s}
.radio-btn.active{background:var(--iwin-light);border-color:var(--iwin-blue);color:var(--iwin-dark);font-weight:500}
.radio-btn:hover{border-color:var(--iwin-blue)}
.yesno{display:flex;gap:6px}
.asset-label{font-size:13px;color:#333;padding:4px 0}
.ben-card{border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin-bottom:0.75rem}
.ben-title{font-size:12px;font-weight:600;color:var(--iwin-blue);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px}
.minor-section{display:none;background:var(--iwin-light);border-radius:8px;padding:10px;margin-top:8px;border:1px solid var(--iwin-mid)}
.conditional-section{display:none;background:#fff8f0;border-radius:8px;padding:12px;margin-top:8px;border:1px solid #f0d9b5}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.25rem}
.btn-back{padding:9px 20px;border:1px solid #d0d7de;border-radius:6px;font-size:13px;cursor:pointer;background:transparent;color:#555}
.btn-back:hover{background:#f0f4f8}
.btn-next{padding:9px 24px;border:none;border-radius:6px;font-size:13px;cursor:pointer;background:var(--iwin-blue);color:#fff;font-weight:500}
.btn-next:hover{background:var(--iwin-dark)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--iwin-light);color:var(--iwin-dark);margin-left:6px;vertical-align:middle}
.submit-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:1.5rem;text-align:center;margin-top:0.5rem}
.submit-icon{width:48px;height:48px;border-radius:50%;background:var(--iwin-light);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:22px;color:var(--iwin-blue)}
.btn-submit{padding:11px 32px;border:none;border-radius:6px;font-size:14px;cursor:pointer;background:var(--iwin-blue);color:#fff;font-weight:500}
.btn-submit:hover{background:var(--iwin-dark)}
.divider{border:none;border-top:1px solid #e2e8f0;margin:1rem 0}
.checklist-item{font-size:13px;color:#555;display:flex;align-items:center;gap:8px;padding:4px 0}
.check-dot{width:6px;height:6px;border-radius:50%;background:var(--iwin-blue);flex-shrink:0}
.success-screen{display:none;text-align:center;padding:3rem 1rem}
.upload-area{border:2px dashed #B5D4F4;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;background:#f8fbff;transition:all 0.2s;position:relative}
.upload-area:hover{border-color:var(--iwin-blue);background:var(--iwin-light)}
.upload-area.has-error{border-color:#e53e3e;background:#fff5f5}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-area .up-icon{font-size:22px;margin-bottom:4px;color:var(--iwin-blue)}
.upload-area .up-label{font-size:13px;font-weight:500;color:var(--iwin-blue)}
.upload-area .up-sub{font-size:11px;color:#888;margin-top:2px}
.upload-error{font-size:11px;color:#e53e3e;margin-top:4px;font-weight:500}
.submit-spinner{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-submit:disabled{opacity:0.7;cursor:not-allowed}
.submit-error{background:#fff5f5;border:1px solid #fed7d7;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;color:#c53030;display:none}
.upload-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.preview-thumb{position:relative;width:80px;height:80px;border-radius:6px;overflow:hidden;border:1px solid #e2e8f0}
.preview-thumb img{width:100%;height:100%;object-fit:cover}
.preview-thumb .remove-btn{position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.upload-group-label{font-size:12px;color:#444;font-weight:500;margin-bottom:6px}
.success-circle{width:72px;height:72px;border-radius:50%;background:var(--iwin-light);display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;font-size:32px;color:var(--iwin-blue)}
/* ── Validation ─────────────────────────────────────────── */
input.field-error,textarea.field-error,select.field-error{border-color:#e53e3e!important;background:#fff8f8;box-shadow:0 0 0 2px rgba(229,62,62,0.15)!important}
.radio-group.field-error,.yesno.field-error{outline:2px solid #e53e3e;border-radius:8px;padding:4px}
.field-error-msg{font-size:11px;color:#e53e3e;margin-top:3px;font-weight:500}
.upload-area.field-error{border-color:#e53e3e!important;background:#fff8f8!important}
.validation-banner{background:#fff0f0;border:1px solid #fed7d7;border-radius:8px;padding:10px 14px;margin-bottom:1rem;font-size:13px;color:#c53030;display:none}
.validation-banner strong{display:block;margin-bottom:4px}
.validation-banner ul{margin:0 0 0 16px;line-height:1.8}
label.fl .req{color:#e53e3e;margin-left:2px}
/* ── Tax residency inline statement ────────────────────── */
.tax-since-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.tax-since-row span{font-size:13px;color:#444}
.tax-since-row input{width:90px;flex-shrink:0}
@media(max-width:500px){.field-row,.field-row.three{grid-template-columns:1fr}}
</style>
</head>

<script>
const STEPS=[{label:'Personal info'},{label:'ID documents'},{label:'Employment'},{label:'Compliance'},{label:'Financials'},{label:'Beneficiaries'}];
let current=0;

function radioGroup(name,opts,tip){
  return'<div class="radio-group" id="rg-'+name+'">'+opts.map(o=>'<button type="button" class="radio-btn" data-name="'+name+'" data-val="'+o+'" onclick="setRadio(this)">'+o+'</button>').join('')+'</div>'+(tip?'<p class="tip">'+tip+'</p>':'');
}
function yesNo(name,tip){
  return'<div class="yesno" id="yn-'+name+'">'+['Yes','No'].map(o=>'<button type="button" class="radio-btn" data-name="'+name+'" data-val="'+o+'" onclick="setRadio(this)">'+o+'</button>').join('')+'</div>'+(tip?'<p class="tip">'+tip+'</p>':'');
}
function setRadio(el){
  document.querySelectorAll('.radio-btn[data-name="'+el.dataset.name+'"]').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  formData[el.dataset.name]=el.dataset.val;
  // Clear radio error
  const grp=el.closest('.radio-group,.yesno');
  if(grp){grp.classList.remove('field-error');const msg=grp.parentElement.querySelector('.field-error-msg');if(msg)msg.remove();}
  // Minor beneficiary toggle
  if(el.dataset.name&&el.dataset.name.startsWith('under18_')){
    const idx=el.dataset.name.split('_')[1];
    const ms=document.getElementById('minor-'+idx);
    if(ms)ms.style.display=el.dataset.val==='Yes'?'block':'none';
  }
  // Tax residency year toggle — show previous address if < 2 years ago
  if(el.dataset.name==='taxca' && el.dataset.val==='Yes'){
    checkTaxSinceYear();
  }
}

function checkYearsAtAddress(){
  const val=document.getElementById('f_years_address')?.value?.trim()||'';
  const prevSection=document.getElementById('prev-addr-section');
  if(!prevSection) return;
  const year=parseInt(val);
  const currentYear=new Date().getFullYear();
  // Show previous address if they moved in 2024 or later (less than 2 full years ago)
  if(year && year >= 2024 && year <= currentYear){
    prevSection.style.display='block';
  } else {
    prevSection.style.display='none';
  }
}

function checkTaxSinceYear(){
  // Show/hide tax year input based on taxca Yes/No — no previous address logic here
  const f=document.getElementById('taxca-year-row');
  if(f) f.style.display='block';
}

function stepHTML(idx){
  switch(idx){
    case 0:return`
      <p class="step-header">Let&#39;s start with the basics</p>
      <p class="step-sub">Your name and contact details &#8212; nothing sensitive here yet.</p>
      <div class="section"><p class="section-title">Legal name</p>
        <div class="field-row three">
          <div class="field-group"><label class="fl">First name <span class="req">*</span></label><input type="text" id="f_first" placeholder="Jane"></div>
          <div class="field-group"><label class="fl">Middle name <span style="font-weight:400;opacity:0.6">(optional)</span></label><input type="text" id="f_middle"></div>
          <div class="field-group"><label class="fl">Last name <span class="req">*</span></label><input type="text" id="f_last" placeholder="Smith"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><label class="fl">Sex <span class="req">*</span></label>${radioGroup('sex',['Male','Female','Other'])}</div>
          <div class="field-group"><label class="fl">Preferred language <span class="req">*</span></label>${radioGroup('lang',['English','French'])}</div>
        </div>
        <div class="field-row">
          <div class="field-group"><label class="fl">Marital status <span class="req">*</span></label>${radioGroup('marital',['Single','Married','Common-law','Separated','Divorced','Widowed'])}</div>
          <div></div>
        </div>
      </div>
      <div class="section"><p class="section-title">Contact</p>
        <div class="field-row">
          <div class="field-group"><label class="fl">Cell phone <span class="req">*</span></label><input type="tel" id="f_cell" placeholder="416-555-0100"></div>
          <div class="field-group"><label class="fl">Email address <span class="req">*</span></label><input type="email" id="f_email" placeholder="jane@email.com"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><label class="fl">Date of birth <span class="req">*</span></label><input type="date" id="f_dob"></div>
          <div></div>
        </div>
      </div>
      <div class="section"><p class="section-title">Home address</p>
        <div class="field-row one"><div class="field-group"><label class="fl">Street address <span class="req">*</span></label><input type="text" placeholder="123 Maple Street, Unit 4"></div></div>
        <div class="field-row three">
          <div class="field-group"><label class="fl">City <span class="req">*</span></label><input type="text" placeholder="Toronto"></div>
          <div class="field-group"><label class="fl">Province <span class="req">*</span></label><input type="text" placeholder="Ontario"></div>
          <div class="field-group"><label class="fl">Postal code <span class="req">*</span></label><input type="text" placeholder="M5V 2T6"></div>
        </div>
        <div class="field-row">
          <div class="field-group"><label class="fl">Housing status <span class="req">*</span></label>${radioGroup('housing',['Homeowner','Renting','Living with parents'])}</div>
          <div class="field-group"><label class="fl">When did you start living at this address? <span class="req">*</span></label><input type="number" id="f_years_address" min="1950" max="2026" placeholder="e.g. 2012, 2020, 2026" oninput="checkYearsAtAddress()"><p class="tip">Enter the year you moved in</p></div>
        </div>
        <div id="prev-addr-section" class="conditional-section" style="display:none">

const FILE_LIMITS = {

  'dl-back':     800 * 1024,
  'id2-front':   800 * 1024,
  'id2-back':    800 * 1024,
  'void-cheque': 800 * 1024

  'dl-front':'800KB','dl-back':'800KB','id2-front':'800KB','id2-back':'800KB','void-cheque':'800KB'
};

// ─── PERSISTED FORM DATA ──────────────────────────────────────────────────────
const formData = {};
const stepComplete = [false,false,false,false,false,false];

// ─── VALIDATION ENGINE ────────────────────────────────────────────────────────
function showFieldError(el, msg){
  if(!el) return;
  el.classList.add('field-error');
  const existing = el.parentElement.querySelector('.field-error-msg');
  if(existing) existing.remove();
  const p = document.createElement('p');
  p.className = 'field-error-msg';
  p.textContent = '⚠ ' + msg;
  el.insertAdjacentElement('afterend', p);
}
function showRadioError(groupEl, msg){
  if(!groupEl) return;
  groupEl.classList.add('field-error');
  const existing = groupEl.parentElement.querySelector('.field-error-msg');
  if(existing) existing.remove();
  const p = document.createElement('p');
  p.className = 'field-error-msg';
  p.textContent = '⚠ ' + msg;
  groupEl.insertAdjacentElement('afterend', p);
}
function showUploadError(key, msg){
  const area = document.getElementById('ua-'+key);
  if(!area) return;
  area.classList.add('field-error');
  const existing = area.parentElement.querySelector('.field-error-msg');
  if(existing) existing.remove();
  const p = document.createElement('p');
  p.className = 'field-error-msg';
  p.textContent = '⚠ ' + msg;
  area.insertAdjacentElement('afterend', p);
}

function validateStep(idx){
  document.querySelectorAll('.field-error').forEach(el=>el.classList.remove('field-error'));
  document.querySelectorAll('.field-error-msg').forEach(el=>el.remove());
  const banner = document.getElementById('val-banner');
  const list = document.getElementById('val-list');
  banner.style.display = 'none';
  list.innerHTML = '';
  const errors = [];

  function reqInput(id, label){
    const el = document.getElementById(id);
    const v = el ? el.value.trim() : (formData[id]||'');
    if(!v){ errors.push(label); if(el) showFieldError(el, label+' is required'); }
    return !!v;
  }
  function reqRadio(name, label){
    const v = getRadio(name);
    if(!v){
      errors.push(label);
      const grp = document.getElementById('rg-'+name) || document.getElementById('yn-'+name);
      if(grp) showRadioError(grp, 'Please select an option');
    }
    return !!v;
  }
  function reqUpload(key, label){
    const files = uploadedFiles[key]||[];
    if(!files.length){ errors.push(label); showUploadError(key, label+' is required'); }
    return files.length > 0;
  }

  // ── STEP 0 ───────────────────────────────────────────────────────────────────
  if(idx===0){
    reqInput('f_first','First name');
    reqInput('f_last','Last name');
    const phone = document.getElementById('f_cell')?.value.trim()||'';
    const email = document.getElementById('f_email')?.value.trim()||'';
    if(!phone && !email){
      errors.push('Cell phone or email (at least one required)');
      showFieldError(document.getElementById('f_cell'),'Enter at least a phone number or email');
      showFieldError(document.getElementById('f_email'),'Enter at least a phone number or email');
    }
    reqInput('f_dob','Date of birth');
    reqRadio('sex','Sex');
    reqRadio('lang','Preferred language');
    reqRadio('marital','Marital status');
    const addr = [...document.querySelectorAll('.section')].find(s=>s.querySelector('.section-title')&&s.querySelector('.section-title').textContent==='Home address');
    if(addr){
      const ins = [...addr.querySelectorAll('input[type=text]')];
      if(!ins[0]?.value.trim()){ errors.push('Street address'); showFieldError(ins[0],'Street address is required'); }
      if(!ins[1]?.value.trim()){ errors.push('City'); showFieldError(ins[1],'City is required'); }
      if(!ins[2]?.value.trim()){ errors.push('Province'); showFieldError(ins[2],'Province is required'); }
      if(!ins[3]?.value.trim()){ errors.push('Postal code'); showFieldError(ins[3],'Postal code is required'); }
    }
    // Address start year — validated by ID
    const addrYearEl = document.getElementById('f_years_address');
    const addrYearVal = addrYearEl?.value?.trim()||'';
    if(!addrYearVal){ errors.push('Year you moved in'); showFieldError(addrYearEl,'Please enter the year you moved in'); }
    reqRadio('housing','Housing status');
    // Previous address required if moved in 2024 or later
    const addrYear = parseInt(addrYearVal);
    const thisYear = new Date().getFullYear();
    if(addrYear && addrYear >= 2024 && addrYear <= thisYear){
      const prevStreet = document.getElementById('prev_addr_street')?.value.trim()||'';
      const prevCity = document.getElementById('prev_addr_city')?.value.trim()||'';
      if(!prevStreet){ errors.push('Previous address — street'); showFieldError(document.getElementById('prev_addr_street'),'Previous street address is required'); }
      if(!prevCity){ errors.push('Previous address — city'); showFieldError(document.getElementById('prev_addr_city'),'City is required'); }
    }
  }

  // ── STEP 1 ───────────────────────────────────────────────────────────────────
  if(idx===1){
    const dlSec = document.querySelectorAll('.section')[0];
    if(dlSec){
      const ins = [...dlSec.querySelectorAll('input')];
      if(!ins[0]?.value.trim()){ errors.push("Driver's licence number"); showFieldError(ins[0],"Driver's licence number is required"); }
      if(!ins[1]?.value.trim()){ errors.push('Province of issuance'); showFieldError(ins[1],'Province of issuance is required'); }
      if(!ins[3]?.value.trim()){ errors.push("Driver's licence expiry date"); showFieldError(ins[3],'Expiry date is required'); }
    }
    reqUpload('dl-front',"Driver's licence — front photo");
    reqUpload('dl-back',"Driver's licence — back photo");
    reqRadio('id2type','Secondary ID type');
    const id2Sec = document.querySelectorAll('.section')[1];
    if(id2Sec){
      const ins = [...id2Sec.querySelectorAll('input[type=text],input[type=date]')];
      if(!ins[0]?.value.trim()){ errors.push('Secondary ID number'); showFieldError(ins[0],'Secondary ID number is required'); }
    }
    reqUpload('id2-front','Secondary ID — front photo');
    const sinSec = document.querySelectorAll('.section')[2];
    if(sinSec){
      const sinIn = sinSec.querySelector('input[type=text]');
      if(!sinIn?.value.trim()){ errors.push('Social Insurance Number (SIN)'); showFieldError(sinIn,'SIN is required'); }
    }
  }

  // ── STEP 2 ───────────────────────────────────────────────────────────────────
  if(idx===2){
    reqRadio('empstatus','Employment status');
    const status = getRadio('empstatus');
    const isEmployed = (status==='Employed');
    if(isEmployed){
      const empSec = document.querySelectorAll('.section')[0];
      if(empSec){
        const ins = [...empSec.querySelectorAll('input[type=text],input[type=tel]')];
        if(!ins[0]?.value.trim()){ errors.push('Employer name'); showFieldError(ins[0],'Employer name is required'); }
        if(!ins[1]?.value.trim()){ errors.push('Job title'); showFieldError(ins[1],'Job title is required'); }
        if(!ins[2]?.value.trim()){ errors.push('Employer address'); showFieldError(ins[2],'Employer address is required'); }
        if(!ins[7]?.value.trim()){ errors.push('Years at this employer'); showFieldError(ins[7],'Years at this employer is required'); }
      }
    }
    const roleSec = document.querySelectorAll('.section')[1];
    if(roleSec){
      const ins = [...roleSec.querySelectorAll('input[type=text]')];
      if(!ins[0]?.value.trim()){ errors.push('Occupation'); showFieldError(ins[0],'Occupation is required'); }
      if(!ins[1]?.value.trim()){ errors.push('Industry'); showFieldError(ins[1],'Industry is required'); }
      if(!ins[2]?.value.trim()){ errors.push('Annual income'); showFieldError(ins[2],'Annual income is required'); }
    }
  }

  // ── STEP 3 ───────────────────────────────────────────────────────────────────
  if(idx===3){
    reqRadio('taxca','Tax resident of Canada');
    // If Yes to taxca, require year
    if(getRadio('taxca')==='Yes'){
      const yearEl = document.getElementById('tax_since_year');
      const year = yearEl ? parseInt(yearEl.value) : 0;
      const currentYear = new Date().getFullYear();
      if(!year || year < 1900 || year > currentYear){
        errors.push('Tax residency year');
        if(yearEl) showFieldError(yearEl,'Please enter a valid year (e.g. 2019)');
      }
    }
    reqRadio('taxus','Tax resident of United States');
    reqRadio('taxother','Tax resident of another country');
    ['pedp','hio','sinconsent','bankrupt','lawsuits','support'].forEach((name,i)=>{
      const labels=['PEDP question','Head of International Organization','SIN consent','Bankruptcy question','Lawsuits question','Support payments question'];
      reqRadio(name,labels[i]);
    });
  }

  // ── STEP 4 ───────────────────────────────────────────────────────────────────
  if(idx===4){
    const assetSec = [...document.querySelectorAll('.section')].find(s=>s.textContent.includes('what you own'));
    if(assetSec){
      const assetIns = [...assetSec.querySelectorAll('input[type=text]')];
      const anyAsset = assetIns.some(el=>el.value.trim()&&el.value.trim()!=='$0');
      if(!anyAsset){
        errors.push('At least one asset value');
        assetIns.forEach(el=>el.classList.add('field-error'));
        const p = document.createElement('p');
        p.className='field-error-msg';
        p.textContent='⚠ Please enter at least one asset value (enter $0 if none apply)';
        assetSec.appendChild(p);
      }
    }
  }

  // ── STEP 5 ───────────────────────────────────────────────────────────────────
  if(idx===5){
    reqUpload('void-cheque','Banking document (void cheque or direct deposit form)');
    [1,2,3,4].forEach(i=>{
      const card = document.querySelectorAll('.ben-card')[i-1];
      if(!card) return;
      const nameIn = card.querySelectorAll('input[type=text]')[0];
      const allocIn = card.querySelectorAll('input[type=text]')[1];
      if(nameIn?.value.trim() && !allocIn?.value.trim()){
        errors.push('Beneficiary '+i+' — allocation % required');
        showFieldError(allocIn,'Allocation % is required when a beneficiary is named');
      }
    });
  }

  if(errors.length){
    list.innerHTML = errors.map(e=>'<li>'+e+'</li>').join('');
    banner.style.display = 'block';
    banner.scrollIntoView({behavior:'smooth', block:'start'});
    return false;
  }
  stepComplete[idx] = true;
  return true;
}

// ─── STEP NAVIGATION ─────────────────────────────────────────────────────────
function renderDots(){
  document.getElementById('dots').innerHTML=STEPS.map((s,i)=>{
    let cls='dot';
    if(i===current) cls+=' active';
    else if(stepComplete[i]) cls+=' done';
    return '<div class="'+cls+'" title="'+s.label+'"></div>';
  }).join('');
}
function renderProgress(){
  const pct=Math.round((current/STEPS.length)*100);
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('slabel').textContent='Step '+(current+1)+' of '+STEPS.length+' — '+STEPS[current].label;
}
function renderStep(){
  document.getElementById('steps-container').innerHTML=stepHTML(current);
  renderDots();
  renderProgress();
  const banner=document.getElementById('val-banner');
  if(banner) banner.style.display='none';
  const isLast=current===STEPS.length-1;
  document.getElementById('btn-back').style.visibility=current===0?'hidden':'visible';
  document.getElementById('btn-next').style.display=isLast?'none':'inline-block';
  document.getElementById('nav-area').style.display=isLast?'none':'flex';
  // Re-apply saved radio selections
  Object.entries(formData).forEach(([name,val])=>{
    document.querySelectorAll('.radio-btn[data-name="'+name+'"]').forEach(b=>{
      b.classList.toggle('active', b.dataset.val===val);
    });
    if(name.startsWith('under18_') && val==='Yes'){
      const idx=name.split('_')[1];
      const ms=document.getElementById('minor-'+idx);
      if(ms) ms.style.display='block';
    }
  });
  // Restore tax residency UI (Step 3)
  if(current===3){
    if(getRadio('taxca')==='Yes'){
      const f=document.getElementById('taxca-year-row');
      if(f) f.style.display='block';
      if(formData.taxSinceYear){
        const el=document.getElementById('tax_since_year');
        if(el) el.value=formData.taxSinceYear;
      }
    }
  }
  // Restore previous address state (Step 0)
  if(current===0){
    if(formData.yearsAtAddress){
      const el=document.getElementById('f_years_address');
      if(el){ el.value=formData.yearsAtAddress; checkYearsAtAddress(); }
    }
    if(formData.prevAddrStreet){ const el=document.getElementById('prev_addr_street'); if(el) el.value=formData.prevAddrStreet; }
    if(formData.prevAddrCity){ const el=document.getElementById('prev_addr_city'); if(el) el.value=formData.prevAddrCity; }
    if(formData.prevAddrProvince){ const el=document.getElementById('prev_addr_province'); if(el) el.value=formData.prevAddrProvince; }
    if(formData.prevAddrCountry){ const el=document.getElementById('prev_addr_country'); if(el) el.value=formData.prevAddrCountry; }
  }
  window.scrollTo(0,0);
}

// ─── FILE UPLOAD ──────────────────────────────────────────────────────────────
const uploadedFiles={};
function handleUpload(input,key){
  if(!uploadedFiles[key])uploadedFiles[key]=[];
  const limit=FILE_LIMITS[key]||2*1024*1024;
  const limitLabel=FILE_LIMIT_LABELS[key]||'800KB';
  const uploadArea=input.closest('.upload-area');
  const existingErr=uploadArea.parentElement.querySelector('.upload-error');
  if(existingErr)existingErr.remove();
  uploadArea.classList.remove('has-error','field-error');
  const existingFErr=uploadArea.parentElement.querySelector('.field-error-msg');
  if(existingFErr)existingFErr.remove();

  Array.from(input.files).forEach(file=>{
    if(file.size>limit){
      const sizeMB=(file.size/1024/1024).toFixed(1);
      uploadArea.classList.add('has-error');
      const errEl=document.createElement('p');
      errEl.className='upload-error';
      errEl.textContent='⚠ "'+file.name+'" is '+sizeMB+'MB — max is '+limitLabel+'. Please compress or crop and try again.';
      uploadArea.insertAdjacentElement('afterend',errEl);
      return;
    }
    uploadedFiles[key].push(file);
    const prevEl=document.getElementById('prev-'+key);
    if(prevEl){
      const reader=new FileReader();
      reader.onload=e=>{
        const thumb=document.createElement('div');
        thumb.className='preview-thumb';
        const isImg=file.type.startsWith('image/');
        thumb.innerHTML=isImg
          ?'<img src="'+e.target.result+'" alt="'+file.name+'">'
          :'<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:#555;padding:4px;text-align:center">'+file.name+'</div>';
        const rm=document.createElement('button');
        rm.className='remove-btn';rm.innerHTML='&times;';rm.title='Remove';
        rm.onclick=()=>{thumb.remove();uploadedFiles[key]=uploadedFiles[key].filter(f=>f!==file);};
        thumb.appendChild(rm);
        prevEl.appendChild(thumb);
      };
      reader.readAsDataURL(file);
    }
  });
  input.value='';
}

// ─── FILE → BASE64 ────────────────────────────────────────────────────────────
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,type:file.type,size:file.size,data:reader.result.split(',')[1]});
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function encodeFileGroup(key){
  const files=uploadedFiles[key]||[];
  if(!files.length)return null;
  const encoded=await Promise.all(files.map(fileToBase64));
  return encoded.length===1?encoded[0]:encoded;
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
async function submitForm(){
  snapshotCurrentStep();
  if(!validateStep(5)) return;

  const btn=document.getElementById('btn-submit');
  const spinner=document.getElementById('submit-spinner');
  const errBox=document.getElementById('submit-error');

  if(document.querySelector('.upload-error')){
    errBox.textContent='Please fix the file size errors above before submitting.';
    errBox.style.display='block';
    return;
  }

  btn.disabled=true;
  spinner.style.display='inline-block';
  btn.childNodes[1].textContent=' Submitting…';
  errBox.style.display='none';

  try{
    const [dlFront,dlBack,id2Front,id2Back,voidCheque]=await Promise.all([
      encodeFileGroup('dl-front'),encodeFileGroup('dl-back'),
      encodeFileGroup('id2-front'),encodeFileGroup('id2-back'),
      encodeFileGroup('void-cheque')
    ]);
    const payload={
      ...collectAllFields(),
      submittedAt:new Date().toISOString(),
      documents:{
        driversLicenceFront:dlFront,
        driversLicenceBack:dlBack,
        secondaryIdFront:id2Front,
        secondaryIdBack:id2Back,
        bankingDocument:voidCheque
      }
    };

const response = await fetch(NETLIFY_FUNCTION_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
let result = {};
    try { result = await response.json(); } catch(e) {}
    if(response.ok && result.success){
      showSuccess();
    } else {
      throw new Error('Submission failed: ' + JSON.stringify(result));
    }
  }catch(err){
    console.error('Submission error:',err);
    btn.disabled=false;
    spinner.style.display='none';
    btn.childNodes[1].textContent=' Submit to iWIN';
errBox.innerHTML='⚠️ Submission failed. Please try again or contact <a href="mailto:iwin@infinitywealth.ca" style="color:#c53030">iwin@infinitywealth.ca</a> directly.';  }
}

function showSuccess(){
  document.getElementById('main-form').style.display='none';
  document.getElementById('success-screen').style.display='block';
  window.scrollTo(0,0);
}
